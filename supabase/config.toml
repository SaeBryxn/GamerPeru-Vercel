# ==============================================================================
# Gamer Perú — Local Supabase Configuration
# Used with Supabase CLI (`pnpm supabase:start`) for zero-cloud local development.
# ==============================================================================

project_id = "gamerperu-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirma tu cuenta en Gamer Perú"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Recupera tu contraseña en Gamer Perú"
content_path = "./supabase/templates/recovery.html"

[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[storage]
enabled = true
file_size_limit = "50MiB"

[inbucket]
enabled = true
port = 54324

[studio]
enabled = true
port = 54323
